name: release

# Reusable release job driven by python-semantic-release (PSR).
# On a releasable commit range PSR bumps the version, updates CHANGELOG.md, runs the
# repo's build_command, commits `chore(release): vX.Y.Z`, tags `vX.Y.Z`, pushes and
# creates the GitHub Release; `publish` then attaches dist/* to that release.
# It pushes with a token from the org's release GitHub App (the only ruleset bypass actor).
# Callers: see templates/ci.yml (job `release`, after `ci`, on push to main only).

on:
  workflow_call:
    secrets:
      app-id:
        description: Release GitHub App client ID (or app ID).
        required: true
      app-private-key:
        description: Release GitHub App private key (PEM).
        required: true

permissions: {}

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          # PSR pushes with GH_TOKEN itself, so the token is not stored in .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No cache in the release job (cache-poisoning hardening).
          enable-cache: false
      - name: Resolve commit author
        id: author
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          echo "author=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - name: semantic-release version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_COMMIT_AUTHOR: ${{ steps.author.outputs.author }}
        run: uvx --from "python-semantic-release==10.7.0" semantic-release version
      - name: semantic-release publish
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: uvx --from "python-semantic-release==10.7.0" semantic-release publish --tag "$RELEASE_TAG"
