name: python-ci

# Reusable CI for agent-workflow-kit Python tool repos.
# Callers: see templates/ci.yml. The single required status check is `ci / ci-ok`.

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the verify matrix.
        type: string
        default: '["3.12","3.13"]'
      link-excludes:
        description: >-
          Newline-separated lychee exclude regexes. Relative links that leave the
          repository (for example `../awkit-docs/...`) are always skipped.
        type: string
        default: |
          ^https?://(localhost|127\.0\.0\.1|\[::1\])([:/]|$)
          ^https://github\.com/agent-workflow-kit/

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect docs-only changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # code=true unless every changed file is *.md or under docs/.
          files=""
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              # HEAD is the PR merge commit; its first parent is the base tip.
              files=$(git diff --name-only HEAD^1 HEAD) || files=""
              ;;
            push)
              if [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                files=$(git diff --name-only "$BEFORE_SHA" HEAD) || files=""
              fi
              ;;
          esac
          code=false
          if [ -z "$files" ]; then
            code=true
          else
            while IFS= read -r f; do
              case "$f" in
                *.md|docs/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: verify (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: uv sync
        run: uv sync --python "$UV_PYTHON"
      - name: make verify
        run: make verify

  schemas:
    name: schemas
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate schemas and config.example.yaml
        env:
          CHECK_JSONSCHEMA: check-jsonschema==0.38.2
          DRAFT: https://json-schema.org/draft/2020-12/schema
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          rc=0
          files=(schemas/**/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::no schemas/**/*.json files found"
          else
            for f in "${files[@]}"; do
              declared=$(jq -r '."$schema" // ""' "$f")
              if [ "$declared" != "$DRAFT" ]; then
                echo "::error file=$f::\$schema must be $DRAFT (found '${declared}')"
                rc=1
              fi
            done
            uvx --from "$CHECK_JSONSCHEMA" check-jsonschema --check-metaschema "${files[@]}" || rc=1
          fi
          if [ -f config.example.yaml ]; then
            if [ -f schemas/config.json ]; then
              uvx --from "$CHECK_JSONSCHEMA" check-jsonschema --schemafile schemas/config.json config.example.yaml || rc=1
            else
              echo "::error file=config.example.yaml::schemas/config.json is missing"
              rc=1
            fi
          fi
          exit "$rc"

  markdown:
    # Runs on every change (including docs-only) because `verify` is skipped then.
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: pymarkdown
        env:
          PYMARKDOWNLNT: pymarkdownlnt==0.9.41
        run: |
          set -euo pipefail
          if [ ! -f .pymarkdown.json ]; then
            echo "::error::.pymarkdown.json is missing; copy it from agent-workflow-kit/awkit-ci"
            exit 1
          fi
          uvx --from "$PYMARKDOWNLNT" pymarkdown --config .pymarkdown.json scan -r .

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare lychee excludes
        id: prep
        env:
          LINK_EXCLUDES: ${{ inputs.link-excludes }}
        run: |
          set -euo pipefail
          # lychee reads .lycheeignore (one regex per line) from the working directory.
          printf '\n%s\n' "$LINK_EXCLUDES" | sed '/^[[:space:]]*$/d' >> .lycheeignore
          # Only file:// links inside this checkout are checked; links that leave it
          # (relative links to sibling repos) are skipped.
          ws_re=$(printf '%s' "$GITHUB_WORKSPACE" | sed 's/[][\.*^$+?(){}|]/\\&/g')
          echo "include=^file://${ws_re}/" >> "$GITHUB_OUTPUT"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          failIfEmpty: false
          args: >-
            --no-progress
            --max-retries 3
            --accept '100..=103,200..=299,429'
            --root-dir '${{ github.workspace }}'
            --include '${{ steps.prep.outputs.include }}'
            --exclude '^file://'
            './**/*.md'

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          set -euo pipefail
          if [ -d .github/workflows ]; then
            "$RUNNER_TEMP/actionlint" -color
          else
            echo "::notice::no .github/workflows directory"
          fi
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR: zizmor==1.31.1
        run: |
          set -euo pipefail
          config=()
          if [ ! -f .github/zizmor.yml ] && [ ! -f zizmor.yml ]; then
            # Default policy: awkit-ci reusable workflows are referenced by release tag
            # (Dependabot bumps them); every other action must be pinned by commit SHA.
            printf '%s\n' \
              'rules:' \
              '  unpinned-uses:' \
              '    config:' \
              '      policies:' \
              '        "agent-workflow-kit/*": ref-pin' \
              '        "*": hash-pin' > "$RUNNER_TEMP/zizmor.yml"
            config=(--config "$RUNNER_TEMP/zizmor.yml")
          fi
          uvx "$ZIZMOR" --format=github "${config[@]}" .

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, verify, schemas, markdown, links, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::one or more required jobs failed or were cancelled"
            exit 1
          fi
